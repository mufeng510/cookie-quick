name: Publish to Chrome Web Store

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Build & Publish Chrome Web Store
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Package
        run: npm run package

      - name: Upload and publish to Chrome Web Store
        # Uses the official Chrome Web Store API. Credentials are provided
        # exclusively via GitHub Secrets and are never printed or logged.
        uses: ewup/chrome-webstore-upload@v1
        with:
          extensionId: ${{ secrets.CHROME_EXTENSION_ID }}
          clientId: ${{ secrets.CHROME_CLIENT_ID }}
          clientSecret: ${{ secrets.CHROME_CLIENT_SECRET }}
          refreshToken: ${{ secrets.CHROME_REFRESH_TOKEN }}
          publisherId: ${{ secrets.CHROME_PUBLISHER_ID }}
          file: release/*.zip
          publish: true
