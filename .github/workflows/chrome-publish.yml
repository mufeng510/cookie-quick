name: Publish to Chrome Web Store

# Manual fallback for (re-)publishing an already-released version; the
# automatic publish runs as part of the Release workflow on every new version.
# To publish a specific release, dispatch this workflow with the ref set to
# its v<version> tag, e.g.:
#   gh workflow run chrome-publish.yml --ref v1.1.0
on:
  workflow_dispatch:

jobs:
  publish:
    name: Build & Publish Chrome Web Store
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Package
        run: npm run package

      - name: Upload and publish to Chrome Web Store
        # Uses the official Chrome Web Store API v2 via the wdzeng/chrome-extension
        # action. Credentials are provided exclusively via GitHub Secrets and are
        # never printed or logged.
        uses: wdzeng/chrome-extension@v2
        with:
          extension-id: ${{ secrets.CHROME_EXTENSION_ID }}
          publisher-id: ${{ secrets.CHROME_PUBLISHER_ID }}
          client-id: ${{ secrets.CHROME_CLIENT_ID }}
          client-secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}
          zip-path: release/*.zip
          action: publish
