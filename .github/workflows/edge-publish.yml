name: Publish to Microsoft Edge Add-ons

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Build & Publish Microsoft Edge Add-ons
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Package
        run: npm run package

      - name: Upload and publish to Microsoft Edge Add-ons
        # Uses the official Microsoft Edge Add-ons API. Credentials are
        # provided exclusively via GitHub Secrets and never logged.
        uses: christophlerschl/edge-addons-action@v1
        with:
          productId: ${{ secrets.EDGE_PRODUCT_ID }}
          clientId: ${{ secrets.EDGE_CLIENT_ID }}
          apiKey: ${{ secrets.EDGE_API_KEY }}
          filePath: release/*.zip
