name: Publish to Microsoft Edge Add-ons

# Manual fallback for (re-)publishing an already-released version; the
# automatic publish runs as part of the Release workflow on every new version.
# To publish a specific release, dispatch this workflow with the ref set to
# its v<version> tag, e.g.:
#   gh workflow run edge-publish.yml --ref v1.1.0
on:
  workflow_dispatch:

jobs:
  publish:
    name: Build & Publish Microsoft Edge Add-ons
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Package
        run: npm run package

      - name: Upload and publish to Microsoft Edge Add-ons
        # Uses the official Microsoft Edge Add-ons API v1.1 via the
        # wdzeng/edge-addon action. Credentials are provided exclusively via
        # GitHub Secrets and are never printed or logged.
        uses: wdzeng/edge-addon@v2
        with:
          product-id: ${{ secrets.EDGE_PRODUCT_ID }}
          client-id: ${{ secrets.EDGE_CLIENT_ID }}
          api-key: ${{ secrets.EDGE_API_KEY }}
          zip-path: release/*.zip
