<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cookie Quick</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <div id="app">
      <header class="app-header">
        <h1 class="app-title">Cookie Quick</h1>
      </header>

      <section class="meta">
        <div class="meta-row">
          <span class="meta-label">当前网站</span>
          <span id="site" class="meta-value">—</span>
        </div>
        <div class="meta-row">
          <span class="meta-label">Cookie</span>
          <span id="count" class="meta-value">—</span>
        </div>
      </section>

      <main class="actions">
        <button id="copy-btn" class="btn btn-copy" disabled>
          📋 复制 Cookie
        </button>
        <button id="delete-btn" class="btn btn-delete" disabled>
          🗑 清除站点数据
        </button>
      </main>

      <section class="panel">
        <button id="import-toggle" class="panel-toggle" type="button" aria-expanded="false">
          <span>📥 导入 Cookie</span>
          <span class="panel-arrow">▾</span>
        </button>
        <div id="import-panel" class="panel-body hidden">
          <textarea
            id="import-input"
            class="import-input"
            rows="3"
            placeholder="粘贴 Cookie 头：&#10;name1=value1; name2=value2"
            spellcheck="false"
          ></textarea>
          <button id="import-btn" class="btn btn-import" disabled>导入到当前网站</button>
        </div>
      </section>

      <section class="panel">
        <button id="profiles-toggle" class="panel-toggle" type="button" aria-expanded="true">
          <span>👤 账号切换（本站）</span>
          <span class="panel-arrow">▾</span>
        </button>
        <div id="profiles-panel" class="panel-body">
          <div class="save-row">
            <input
              id="profile-remark"
              class="remark-input"
              type="text"
              maxlength="50"
              placeholder="备注（可选），如：工作账号"
            />
            <button id="save-profile-btn" class="btn-save" disabled>保存</button>
          </div>
          <ul id="profile-list" class="profile-list"></ul>
          <p class="storage-note">账号数据仅保存在本机浏览器中，不联网。</p>
        </div>
      </section>

      <footer class="status">
        <span id="status" class="status-text">正在加载…</span>
      </footer>
    </div>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>
